name: 🔍 Detect Unity Versions
on:
  workflow_call:
    inputs:
      version-streams:
        description: 'Optional override, comma-separated (e.g. "6000.0,6000.3"). Empty = auto-detect every active LTS stream plus the latest non-LTS stable stream.'
        required: false
        default: ''
        type: string
    outputs:
      versions:
        description: "JSON array of detected Unity versions for matrix use"
        value: ${{ jobs.detect.outputs.versions }}

jobs:
  detect:
    name: Detect Latest Unity Versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - name: Resolve Unity versions
        id: detect
        run: |
          set -o pipefail

          STREAMS_INPUT="${{ inputs.version-streams }}"
          API="https://services.api.unity.com/unity/editor/release/v1/releases"

          # The image game-ci/unity-test-runner@v4 pulls on a Linux runner: its game-ci
          # CLI defaults tests to StandaloneLinux64 (the linux-il2cpp module on Unity
          # 2020+) with containerRegistryImageVersion 3. Keep in sync with test.yml.
          IMAGE_PREFIX="ubuntu"
          IMAGE_SUFFIX="linux-il2cpp-3"

          # Every request uses `curl --retry 2`: it retries timeouts and HTTP 408, 429,
          # 500, 502, 503 and 504 (not 404) after 1s, then 2s. A failed Unity API call
          # can fail the job, and a failed Docker Hub check drops a stream, so a single
          # transient error shouldn't be enough to do either.

          if [ -n "$STREAMS_INPUT" ]; then
            MODE="pinned"
            STREAM_LIST=$(echo "$STREAMS_INPUT" | tr ',' '\n' | xargs -n1 | sed -E 's/^6\./6000./' | sort -Vu | tr '\n' ' ')
          else
            MODE="auto"

            # Unity's release API is the only source that labels a stream LTS.
            # limit caps at 25; that window spans several months, so every
            # actively-released stream appears in it.
            LTS=$(curl -sf --retry 2 "$API?stream=LTS&limit=25&order=RELEASE_DATE_DESC") || {
              echo "::error::Unity release API query failed"
              exit 1
            }
            STREAM_LIST=$(echo "$LTS" | jq -r '.results[].version | split(".")[0:2] | join(".")')

            # SUPPORTED is the stable non-LTS track; prereleases live in the separate
            # BETA/ALPHA streams, so its newest entry is the latest non-beta stream.
            if SUP=$(curl -sf --retry 2 "$API?stream=SUPPORTED&limit=25&order=RELEASE_DATE_DESC"); then
              STREAM_LIST+=$'\n'$(echo "$SUP" | jq -r '.results[].version | split(".")[0:2] | join(".")' | sort -V | tail -1)
            else
              echo "::warning::Could not query the non-LTS (SUPPORTED) stream; testing LTS only"
            fi

            STREAM_LIST=$(echo "$STREAM_LIST" | grep -v '^$' | sort -Vu | tr '\n' ' ')
          fi

          read -ra STREAMS <<< "$STREAM_LIST"
          if [ ${#STREAMS[@]} -eq 0 ]; then
            echo "::error::No Unity streams found ($MODE mode)"
            exit 1
          fi
          echo "Unity streams ($MODE): ${STREAMS[*]}"

          VERSIONS="["
          FIRST=true
          MISSING=""

          for STREAM in "${STREAMS[@]}"; do
            ESCAPED=${STREAM//./\\.}

            # Once a stream moves to Extended LTS, its new patches need an Industry or
            # Enterprise license, so a Personal license can't open them (exit code 198).
            # No API flags those patches; Unity's public release API just leaves them
            # out. So candidates come only from that list (final releases, newest
            # first), and if it can't be reached we fail rather than guess.
            PUBLIC=$(curl -sf --retry 2 "$API?version=${STREAM}&limit=25&order=RELEASE_DATE_DESC" | \
              jq -r '.results[].version') || {
              echo "::error::Could not list public Unity $STREAM releases; refusing to guess, since the newest image may be an Extended LTS patch"
              exit 1
            }
            CANDIDATES=$(grep -E "^${ESCAPED}\.[0-9]+f[0-9]+$" <<< "$PUBLIC" | sort -Vr) || CANDIDATES=""

            # Take the newest candidate whose image the test job will actually pull.
            # Checking that exact tag (not any tag for the version) skips patches that
            # game-ci has only built some images for so far.
            VERSION=""
            for CANDIDATE in $CANDIDATES; do
              TAG="${IMAGE_PREFIX}-${CANDIDATE}-${IMAGE_SUFFIX}"
              CODE=$(curl -s --retry 2 -o /dev/null -w '%{http_code}' "https://registry.hub.docker.com/v2/repositories/unityci/editor/tags/${TAG}") || CODE="000"
              if [ "$CODE" = "200" ]; then
                VERSION=$CANDIDATE
                break
              elif [ "$CODE" = "404" ]; then
                echo "Skipping Unity $CANDIDATE: no unityci/editor:$TAG image yet"
              else
                echo "::warning::Docker Hub lookup for unityci/editor:$TAG failed (HTTP $CODE)"
                break
              fi
            done

            if [ -n "$VERSION" ]; then
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                VERSIONS+=","
              fi
              VERSIONS+="\"$VERSION\""
              echo "Detected Unity $STREAM: $VERSION"
            else
              MISSING+=" $STREAM"
            fi
          done

          VERSIONS+="]"

          if [ -n "$MISSING" ]; then
            if [ "$MODE" = "pinned" ]; then
              # An explicitly requested stream must exist; a miss is a config error.
              echo "::error::No public Unity release with a unityci/editor image for pinned stream(s):$MISSING"
              exit 1
            fi
            # In auto mode a new stream routinely lands before game-ci builds its
            # image. Warn instead of failing, but never let the matrix go empty.
            echo "::warning::No unityci/editor image yet for stream(s):$MISSING"
          fi

          if [ "$FIRST" = true ]; then
            echo "::error::No Unity versions resolved for any stream"
            exit 1
          fi

          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "Output matrix: $VERSIONS"
