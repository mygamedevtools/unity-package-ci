name: 📦 Package & Publish
on:
  workflow_call:
    inputs:
      version:
        description: 'The version to package (e.g., 1.2.3 or 1.2.3-pre.1)'
        required: true
        type: string
      package-path:
        description: 'Path to the package directory. Empty = the pkgRoot of @semantic-release/npm in .releaserc.json.'
        required: false
        default: ''
        type: string
      unitypackage-export-method:
        description: 'Static method that exports a .unitypackage, e.g. "PackageExporter.ExportPackage". Empty = no .unitypackage.'
        required: false
        default: ''
        type: string
      publish:
        description: 'Push the upm branch and tag, and attach the packages to the release. False builds and verifies only.'
        required: false
        default: true
        type: boolean
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_ORG_ID:
        required: true
      UPM_SERVICE_ACCOUNT_KEY_ID:
        required: true
      UPM_SERVICE_ACCOUNT_KEY_SECRET:
        required: true

# Every job runs the same "Prepare Package" step. It is inlined rather than a local
# composite action because `uses: ./...` resolves against the caller's checkout, not
# this repository.
jobs:
  package-upm:
    name: Package UPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      releaseVersion: ${{ inputs.version }}
    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: 📦 Prepare Package
      shell: bash
      run: |
        PACKAGE_PATH='${{ inputs.package-path }}'
        if [ -z "$PACKAGE_PATH" ]; then
          PACKAGE_PATH=$(jq -r '.plugins[] | select(type == "array" and .[0] == "@semantic-release/npm") | .[1].pkgRoot' .releaserc.json)
        fi
        echo "PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"
        echo "PACKAGE_NAME=$(jq -r '.name' "$PACKAGE_PATH/package.json")" >> "$GITHUB_ENV"

        # Samples are kept in `Samples` so the dev project compiles them, and the
        # packaging jobs rename the folder to `Samples~` to hide it in the shipped
        # package. The declared sample paths have to follow that rename.
        jq '.version = "${{ inputs.version }}"
            | (.samples[]?.path) |= sub("^Samples/"; "Samples~/")' \
          "$PACKAGE_PATH/package.json" > package.json.tmp
        mv package.json.tmp "$PACKAGE_PATH/package.json"

    - name: 📦 Package UPM Branch
      id: package_upm
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git commit --amend -a --no-edit
        git branch -d upm &> /dev/null || echo upm branch not found
        git subtree split -P "$PACKAGE_PATH" -b upm
        git checkout upm
        if [[ -d "Samples" ]]; then
          git mv Samples Samples~
          rm -f Samples.meta
          git commit --amend -a --no-edit
        fi
        echo "✅ upm branch built from \`$PACKAGE_PATH\`" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: 🚀 Push UPM Branch
      if: ${{ inputs.publish }}
      run: git push -f -u origin upm

    - name: 🏷️ Create UPM Tag
      if: ${{ inputs.publish }}
      run: |
        git tag "$TAG" upm
        git push origin --tags
      env:
        TAG: upm/${{ env.releaseVersion }}

  export-unity-package:
    name: Export Unity Package
    if: ${{ inputs.unitypackage-export-method != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      releaseVersion: ${{ inputs.version }}
    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v5

    - name: 📦 Prepare Package
      shell: bash
      run: |
        PACKAGE_PATH='${{ inputs.package-path }}'
        if [ -z "$PACKAGE_PATH" ]; then
          PACKAGE_PATH=$(jq -r '.plugins[] | select(type == "array" and .[0] == "@semantic-release/npm") | .[1].pkgRoot' .releaserc.json)
        fi
        echo "PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"
        echo "PACKAGE_NAME=$(jq -r '.name' "$PACKAGE_PATH/package.json")" >> "$GITHUB_ENV"
        jq '.version = "${{ inputs.version }}"
            | (.samples[]?.path) |= sub("^Samples/"; "Samples~/")' \
          "$PACKAGE_PATH/package.json" > package.json.tmp
        mv package.json.tmp "$PACKAGE_PATH/package.json"

    - name: 🔄 Rename Samples Folder
      run: |
        if [[ -d "$PACKAGE_PATH/Samples" ]]; then
          mv "$PACKAGE_PATH/Samples" "$PACKAGE_PATH/Samples~"
          rm -f "$PACKAGE_PATH/Samples.meta"
        fi

    - name: 🗃️ Cache Library
      uses: actions/cache@v5
      with:
        path: Library
        key: Library-StandaloneLinux64
        restore-keys: Library-

    - name: 📦 Export Unity Package
      uses: game-ci/unity-builder@v4
      with:
        targetPlatform: StandaloneLinux64
        buildMethod: ${{ inputs.unitypackage-export-method }}
        projectPath: "."
        allowDirtyBuild: true
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    - name: 🗂️ Upload Unity Package Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.PACKAGE_NAME }}-${{ env.releaseVersion }}
        path: "./*.unitypackage"

    - name: 📎 Attach Unity Package to Release
      if: ${{ inputs.publish }}
      run: |
        gh release upload ${{ env.releaseVersion }} ./*.unitypackage --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  export-signed-upm:
    name: Export Signed UPM Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      releaseVersion: ${{ inputs.version }}
      # Read by the `upm` CLI when it signs the tarball
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
      DIST_DIR: ${{ github.workspace }}/upm-dist
    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v5

    - name: 📦 Prepare Package
      shell: bash
      run: |
        PACKAGE_PATH='${{ inputs.package-path }}'
        if [ -z "$PACKAGE_PATH" ]; then
          PACKAGE_PATH=$(jq -r '.plugins[] | select(type == "array" and .[0] == "@semantic-release/npm") | .[1].pkgRoot' .releaserc.json)
        fi
        echo "PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"
        echo "PACKAGE_NAME=$(jq -r '.name' "$PACKAGE_PATH/package.json")" >> "$GITHUB_ENV"
        jq '.version = "${{ inputs.version }}"
            | (.samples[]?.path) |= sub("^Samples/"; "Samples~/")' \
          "$PACKAGE_PATH/package.json" > package.json.tmp
        mv package.json.tmp "$PACKAGE_PATH/package.json"

    - name: 🔄 Rename Samples Folder
      run: |
        if [[ -d "$PACKAGE_PATH/Samples" ]]; then
          mv "$PACKAGE_PATH/Samples" "$PACKAGE_PATH/Samples~"
          rm -f "$PACKAGE_PATH/Samples.meta"
        fi

    - name: 🛠️ Install Unity Package Manager CLI
      run: |
        curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh -o "$RUNNER_TEMP/install-upm.sh"
        bash "$RUNNER_TEMP/install-upm.sh"
        echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

    - name: 🔏 Pack & Sign UPM Package
      run: |
        mkdir -p "$DIST_DIR"
        upm --version
        upm pack "$PACKAGE_PATH" \
          --organization-id "${{ secrets.UNITY_ORG_ID }}" \
          --destination "$DIST_DIR"

    - name: ✅ Verify Signed Package
      run: |
        shopt -s nullglob
        archives=("$DIST_DIR"/*.tgz "$DIST_DIR"/*.tar.gz)
        if [[ ${#archives[@]} -ne 1 ]]; then
          echo "::error::Expected exactly one signed archive in $DIST_DIR, found ${#archives[@]}"
          exit 1
        fi
        archive="${archives[0]}"

        tar -tzf "$archive" | grep -qx 'package/package.json' \
          || { echo "::error::Tarball is missing package/package.json"; exit 1; }
        tar -tzf "$archive" | grep -qx 'package/.attestation.p7m' \
          || { echo "::error::Tarball is unsigned - missing package/.attestation.p7m"; exit 1; }

        packedName=$(tar -xOzf "$archive" package/package.json | jq -r '.name')
        packedVersion=$(tar -xOzf "$archive" package/package.json | jq -r '.version')
        if [[ "$packedVersion" != "$releaseVersion" ]]; then
          echo "::error::Packed version $packedVersion does not match release $releaseVersion"
          exit 1
        fi

        # OpenUPM resolves the release asset by the "<package-name>-" prefix, so pin the filename
        expected="$DIST_DIR/$packedName-$packedVersion.tgz"
        [[ "$archive" == "$expected" ]] || mv "$archive" "$expected"

        echo "PACKAGE_ARCHIVE=$expected" >> "$GITHUB_ENV"
        echo "✅ Signed \`$packedName@$packedVersion\`" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: 🗂️ Upload Signed UPM Package Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.PACKAGE_NAME }}-${{ env.releaseVersion }}-signed
        path: ${{ env.PACKAGE_ARCHIVE }}

    - name: 📎 Attach Signed UPM Package to Release
      if: ${{ inputs.publish }}
      run: |
        gh release upload "$releaseVersion" "$PACKAGE_ARCHIVE" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
