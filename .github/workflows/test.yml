name: 🧪 Tests
on:
  workflow_call:
    inputs:
      coverage-assemblies:
        description: 'Code coverage assembly filter, e.g. "+MyGameDevTools.SceneLoading". Empty = every assembly.'
        required: false
        default: ''
        type: string
      test-mode:
        description: 'game-ci test mode: playmode, editmode or all.'
        required: false
        default: 'all'
        type: string
      version-streams:
        description: 'Optional override, comma-separated (e.g. "6000.0,6000.3"). Empty = every active LTS stream plus the latest non-LTS stable stream.'
        required: false
        default: ''
        type: string
      graphics:
        description: 'Start the editor with a graphics device. Off by default: the runner has no GPU, so every play mode frame is rendered in software.'
        required: false
        default: false
        type: boolean
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      CODECOV_TOKEN:
        required: false

jobs:
  detect-versions:
    name: Detect Unity Versions
    uses: ./.github/workflows/detect-unity-versions.yml
    with:
      version-streams: ${{ inputs.version-streams }}

  test:
    name: Unity ${{ matrix.unityVersion }} - ${{ inputs.test-mode }}
    runs-on: ubuntu-latest
    needs: detect-versions
    strategy:
      fail-fast: false
      matrix:
        unityVersion: ${{ fromJSON(needs.detect-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - '**.cs'

      - name: Extract Unity major version
        id: unity-version
        run: echo "major=$(echo '${{ matrix.unityVersion }}' | grep -oE '^[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"

      # Restored by stream, so a new patch imports warm and skips Crunch (UUM-150055).
      - uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ steps.unity-version.outputs.major }}-${{ inputs.test-mode }}-${{ matrix.unityVersion }}
          restore-keys: |
            Library-${{ steps.unity-version.outputs.major }}-${{ inputs.test-mode }}-

      # A project that needs different packages on an older stream keeps a
      # Packages/manifest.<stream>.json next to its manifest, named either
      # manifest.6000.0.json or manifest.6.0.json.
      - name: Use stream-specific package manifest
        run: |
          STREAM='${{ steps.unity-version.outputs.major }}'
          for candidate in "Packages/manifest.$STREAM.json" "Packages/manifest.${STREAM/#6000./6.}.json"; do
            if [ -f "$candidate" ]; then
              cp "$candidate" Packages/manifest.json
              # The lock file can pin packages this stream doesn't have.
              rm -f Packages/packages-lock.json
              echo "Using $candidate"
              break
            fi
          done

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ./
          unityVersion: ${{ matrix.unityVersion }}
          testMode: ${{ inputs.test-mode }}
          artifactsPath: ${{ inputs.test-mode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.unityVersion }} ${{ inputs.test-mode }} Test Results
          coverageOptions: ${{ inputs.coverage-assemblies != '' && format('generateAdditionalMetrics;assemblyFilters:{0}', inputs.coverage-assemblies) || 'generateAdditionalMetrics' }}
          # Without a GPU the editor renders through llvmpipe, which made scene-loader's
          # play mode suite take 6 to 18 minutes instead of seconds.
          customParameters: ${{ !inputs.graphics && '-nographics' || '' }}

      - name: Upload Coverage to Codecov
        if: steps.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: codecov/codecov-action@v5
        with:
          name: Unity ${{ matrix.unityVersion }} - ${{ inputs.test-mode }}
          flags: unity-${{ steps.unity-version.outputs.major }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.tests.outputs.coveragePath }}/**/*.xml

      - name: Create issue on scheduled test failure
        uses: jayqi/failed-build-issue-action@v1
        if: failure() && github.event_name == 'schedule'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title-template: "Scheduled test failed for Unity ${{ matrix.unityVersion }}"
          label-name: test-failure
